<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自主學習歷程紀錄與報告系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableReport, #printableReport * { visibility: visible; }
      #printableReport { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- 登入與註冊視窗 -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-4">
      
      <!-- 登入 / 註冊 切換 Tab -->
      <div class="flex border-b text-center font-bold text-sm">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 pb-2 border-b-2 border-indigo-600 text-indigo-600">🔐 帳號登入</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="w-1/2 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600">✨ 新用戶註冊</button>
      </div>

      <p id="authDesc" class="text-xs text-slate-500 text-center">輸入您的姓名與個人通行碼解鎖專屬紀錄</p>

      <form id="authForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">您的姓名 / 暱稱</label>
          <input type="text" id="authUser" required placeholder="例如：張小明" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">個人通行碼 (PIN Code)</label>
          <input type="password" id="authPin" required placeholder="設定 4 位以上數字或密碼" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow transition-colors">
          進入我的學習空間
        </button>
      </form>
    </div>
  </div>

  <!-- 主介面 -->
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <header class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">🎓 自主學習歷程紀錄系統</h1>
        <p class="text-xs text-slate-500 mt-1">紀錄每日學習，自動生成專屬學習歷程報告與時間軸</p>
      </div>

      <div class="flex items-center gap-3 bg-indigo-50 px-3 py-2 rounded-xl border border-indigo-100">
        <span class="text-xs font-bold text-indigo-700">👤 目前使用者：<span id="currentUserSpan" class="text-indigo-900 font-extrabold">未登入</span></span>
        <button onclick="logout()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-2 py-1 rounded-md">登出 / 切換</button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 表單 -->
      <div class="md:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold mb-4 text-indigo-600 flex items-center gap-1.5">✍️ 新增學習紀錄</h2>
        <form id="logForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">學習日期</label>
            <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">學習科目 / 主題</label>
            <input type="text" id="subject" placeholder="例如：Python, 英文" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">學習時間 (分鐘)</label>
            <input type="number" id="duration" min="1" placeholder="例如：60" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">學習內容 / 筆記重點</label>
            <textarea id="content" rows="4" placeholder="今天學到了什麼概念？" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>
          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-sm">儲存紀錄</button>
        </form>
      </div>

      <!-- 列表 -->
      <div class="md:col-span-2 space-y-4">
        <div class="bg-indigo-600 text-white p-5 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
          <div class="flex gap-6 text-center sm:text-left">
            <div>
              <div class="text-xs text-indigo-200">個人總筆記</div>
              <div id="totalLogs" class="text-2xl font-black">0 筆</div>
            </div>
            <div>
              <div class="text-xs text-indigo-200">累積學習時數</div>
              <div id="totalHours" class="text-2xl font-black">0 小時</div>
            </div>
          </div>
          <button onclick="generatePDFReport()" class="w-full sm:w-auto bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-4 py-2.5 rounded-xl shadow-md transition-all text-sm">📄 生成學習歷程報告 (PDF)</button>
        </div>

        <div class="flex justify-between items-center px-1">
          <h2 class="text-lg font-bold text-slate-800">我的學習紀錄脈絡</h2>
          <button id="reloadBtn" class="text-xs text-indigo-600 hover:underline">重新整理</button>
        </div>

        <div id="logsContainer" class="space-y-3">
          <div class="text-center py-8 text-slate-400">請先登入驗證身分...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF 報告 Modal -->
  <div id="reportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 bg-slate-800 text-white flex justify-between items-center no-print">
        <span class="text-sm font-semibold">📄 個人學習歷程報告</span>
        <div class="flex gap-2">
          <button onclick="window.print()" class="bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">🖨️ 列印 / 另存 PDF</button>
          <button onclick="closeReportModal()" class="text-slate-400 hover:text-white font-bold px-2">✕</button>
        </div>
      </div>
      <div id="printableReport" class="p-8 overflow-y-auto space-y-6"></div>
    </div>
  </div>

  <script>
    // ⚠️ 填入你的 Apps Script 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbyGp5SXGlgZXysFijKsKsQSTZsNMeXiOkvu18_1AYfRgJm8VYmhhbEpmV-b4MxnWY-P/exec";

    let currentMode = 'login'; // 'login' 或 'register'
    let currentUser = localStorage.getItem('tracker_user') || '';
    let currentPin = localStorage.getItem('tracker_pin') || '';
    let userLogs = [];

    document.getElementById('date').valueAsDate = new Date();

    if (currentUser && currentPin) {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('currentUserSpan').innerText = currentUser;
      fetchLogs();
    }

    function switchAuthTab(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const btn = document.getElementById('authSubmitBtn');
      const desc = document.getElementById('authDesc');

      if (mode === 'login') {
        tabLogin.className = "w-1/2 pb-2 border-b-2 border-indigo-600 text-indigo-600";
        tabRegister.className = "w-1/2 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        btn.innerText = "進入我的學習空間";
        desc.innerText = "輸入您的姓名與個人通行碼解鎖專屬紀錄";
      } else {
        tabRegister.className = "w-1/2 pb-2 border-b-2 border-indigo-600 text-indigo-600";
        tabLogin.className = "w-1/2 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        btn.innerText = "建立新帳號並登入";
        desc.innerText = "註冊新姓名與自訂通行碼，資料將自動儲存";
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('authUser').value.trim();
      const pin = document.getElementById('authPin').value.trim();

      if (!user || !pin) {
        alert("請輸入姓名與通行碼");
        return;
      }

      if (currentMode === 'register') {
        const btn = document.getElementById('authSubmitBtn');
        btn.disabled = true;
        btn.innerText = "註冊中...";

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "register", userName: user, pinCode: pin })
          });
          const result = await res.json();

          if (result.status === "success") {
            alert("🎉 註冊成功！已為您自動儲存至試算表 Users 名冊");
            loginUser(user, pin);
          } else {
            alert("❌ " + result.message);
          }
        } catch (err) {
          alert("註冊請求發送失敗，請重試");
        } finally {
          btn.disabled = false;
          btn.innerText = "建立新帳號並登入";
        }
      } else {
        loginUser(user, pin);
      }
    });

    function loginUser(user, pin) {
      currentUser = user;
      currentPin = pin;
      localStorage.setItem('tracker_user', currentUser);
      localStorage.setItem('tracker_pin', currentPin);
      document.getElementById('currentUserSpan').innerText = currentUser;
      document.getElementById('loginModal').classList.add('hidden');
      fetchLogs();
    }

    function logout() {
      localStorage.removeItem('tracker_user');
      localStorage.removeItem('tracker_pin');
      currentUser = '';
      currentPin = '';
      document.getElementById('currentUserSpan').innerText = "未登入";
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('logsContainer').innerHTML = `<div class="text-center py-8 text-slate-400">請先登入驗證身分...</div>`;
      document.getElementById('totalLogs').innerText = "0 筆";
      document.getElementById('totalHours').innerText = "0 小時";
    }

    function fetchLogs() {
      if (!currentUser || !currentPin) return;

      const container = document.getElementById('logsContainer');
      container.innerHTML = `<div class="text-center py-8 text-slate-400">正在驗證身分並載入【${currentUser}】的個人紀錄...</div>`;

      window.handleApiResponse = function(result) {
        if (result && result.status === "success") {
          userLogs = result.data || [];
          renderUserLogs();
        } else {
          container.innerHTML = `<div class="text-red-500 text-center py-4">驗證失敗：${result ? result.message : '帳號或通行碼錯誤'}</div>`;
        }
      };

      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `${API_URL}?userName=${encodeURIComponent(currentUser)}&pinCode=${encodeURIComponent(currentPin)}&callback=handleApiResponse&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function renderUserLogs() {
      const container = document.getElementById('logsContainer');
      const totalLogsEl = document.getElementById('totalLogs');
      const totalHoursEl = document.getElementById('totalHours');

      if (userLogs.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400">您目前尚無學習紀錄，請新增第一筆吧！</div>`;
        totalLogsEl.innerText = "0 筆";
        totalHoursEl.innerText = "0 小時";
        return;
      }

      let totalMinutes = 0;
      const sortedLogs = [...userLogs].reverse();

      container.innerHTML = sortedLogs.map(log => {
        totalMinutes += Number(log.duration || 0);
        const dateStr = log.date ? new Date(log.date).toLocaleDateString("zh-TW") : "無日期";

        return `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <span class="inline-block px-2.5 py-1 bg-indigo-100 text-indigo-700 font-bold rounded-md text-xs">
                ${log.subject}
              </span>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">${dateStr}</span>
                <button onclick="deleteLog('${log.id}')" class="text-xs text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-0.5 rounded transition-colors font-medium">
                  🗑️ 刪除
                </button>
              </div>
            </div>
            <p class="text-slate-700 text-sm mb-2 whitespace-pre-line">${log.content}</p>
            <div class="text-right text-xs text-slate-500">
              ⏱️ 學習時間：<span class="font-bold text-slate-800">${log.duration}</span> 分鐘
            </div>
          </div>
        `;
      }).join('');

      totalLogsEl.innerText = userLogs.length + " 筆";
      totalHoursEl.innerText = (totalMinutes / 60).toFixed(1) + " 小時";
    }

    async function deleteLog(logId) {
      if (!confirm("確定要刪除這筆學習紀錄嗎？")) return;

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "delete", id: logId, userName: currentUser, pinCode: currentPin })
        });

        alert("🗑️ 紀錄已成功刪除！");
        setTimeout(fetchLogs, 1500);
      } catch (err) {
        alert("刪除失敗");
      }
    }

    function generatePDFReport() {
      if (userLogs.length === 0) {
        alert("目前尚無學習紀錄可生成報告！");
        return;
      }

      const sortedLogs = [...userLogs].sort((a, b) => new Date(a.date) - new Date(b.date));
      const subjectStats = {};
      let totalMinutes = 0;

      sortedLogs.forEach(log => {
        const mins = Number(log.duration || 0);
        totalMinutes += mins;
        subjectStats[log.subject] = (subjectStats[log.subject] || 0) + mins;
      });

      let subjectHtml = Object.keys(subjectStats).map(sub => {
        const mins = subjectStats[sub];
        const percent = Math.round((mins / totalMinutes) * 100);
        return `
          <div class="bg-slate-50 p-3 rounded-lg border text-center">
            <div class="text-xs text-slate-500">${sub}</div>
            <div class="text-base font-bold text-indigo-600">${(mins / 60).toFixed(1)} 小時</div>
            <div class="text-xs text-slate-400">占比 ${percent}%</div>
          </div>
        `;
      }).join('');

      let timelineHtml = sortedLogs.map((log, index) => {
        const dateStr = log.date ? new Date(log.date).toLocaleDateString("zh-TW") : "無日期";
        return `
          <div class="border-l-2 border-indigo-400 pl-4 py-2 relative">
            <div class="absolute -left-[5px] top-3.5 w-2 h-2 rounded-full bg-indigo-600"></div>
            <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
              <span class="font-bold text-indigo-700">第 ${index + 1} 階段 • ${dateStr}</span>
              <span>${log.subject} (${log.duration} 分鐘)</span>
            </div>
            <div class="text-sm font-medium text-slate-800 whitespace-pre-line bg-slate-50 p-3 rounded-lg border border-slate-100">${log.content}</div>
          </div>
        `;
      }).join('');

      document.getElementById('printableReport').innerHTML = `
        <div class="border-b-2 border-indigo-600 pb-4 mb-6 flex justify-between items-end">
          <div>
            <h1 class="text-2xl font-black text-slate-900">自主學習歷程與總複習成果報告</h1>
            <p class="text-xs text-slate-500 mt-1">學習者：<span class="text-indigo-600 font-bold text-sm">${currentUser}</span> | 產出日期：${new Date().toLocaleDateString("zh-TW")}</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-400 block">總投入時間</span>
            <span class="text-xl font-bold text-indigo-600">${(totalMinutes / 60).toFixed(1)} 小時</span>
          </div>
        </div>
        <div class="mb-6">
          <h3 class="text-sm font-bold text-slate-700 mb-3">📊 科目學習時間分配摘要</h3>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${subjectHtml}</div>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-700 mb-3">📌 按時間軸排定之單元學習與複習脈絡</h3>
          <div class="space-y-3">${timelineHtml}</div>
        </div>
      `;

      document.getElementById('reportModal').classList.remove('hidden');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.add('hidden');
    }

    document.getElementById('logForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "儲存中...";

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            date: document.getElementById('date').value,
            subject: document.getElementById('subject').value,
            duration: document.getElementById('duration').value,
            content: document.getElementById('content').value,
            userName: currentUser,
            pinCode: currentPin
          })
        });

        document.getElementById('subject').value = '';
        document.getElementById('duration').value = '';
        document.getElementById('content').value = '';

        alert(`🎉 紀錄已成功儲存！`);
        setTimeout(fetchLogs, 1500);
      } catch (err) {
        alert("儲存失敗，請重試");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "儲存紀錄";
      }
    });

    document.getElementById('reloadBtn').addEventListener('click', fetchLogs);
  </script>
</body>
</html>
